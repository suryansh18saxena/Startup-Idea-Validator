{% extends "home/base.html" %}

{% block title %}Edit PRD Report{% endblock %}

{% block button %}{% endblock %}

{% block printbutton %}{% endblock %}

{% block body %}
<!-- TinyMCE Visual Editor Library via CDN -->
<script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

<style>
    .main-content {
        margin-left: 220px;
        padding: 2rem;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        background: white;
        padding: 1.5rem 2rem;
        border-radius: 16px;
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-lg);
    }

    .header-info h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
        color: var(--text-primary);
    }

    .header-info p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.95rem;
    }

    .editor-container {
        background: white;
        border-radius: 16px;
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-lg);
        padding: 1px;
        /* To house the editor nicely */
        overflow: hidden;
    }

    .actions {
        display: flex;
        gap: 1rem;
    }

    .btn-action {
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .btn-cancel {
        background: #f1f5f9;
        color: var(--text-secondary);
    }

    .btn-cancel:hover {
        background: #e2e8f0;
    }

    .btn-save {
        background: var(--gradient-primary);
        color: white;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(79, 70, 229, 0.3);
    }

    /* Customize TinyMCE to look modern */
    .tox-tinymce {
        border: none !important;
        border-radius: 16px !important;
    }

    @media (max-width: 768px) {
        .main-content {
            margin-left: 0;
            padding: 1rem;
        }

        .page-header {
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
        }
    }
</style>

<div class="main-content">
    <form method="POST">
        {% csrf_token %}

        <div class="page-header">
            <div class="header-info">
                <h1>Edit Product Requirements Document</h1>
                <p>Idea: <strong>{{ idea.problem_statement|truncatechars:50 }}</strong></p>
            </div>
            <div class="actions">
                <a href="{% url 'my_prds' %}" class="btn-action btn-cancel"><i class="ph-bold ph-x"></i> Cancel</a>
                <button type="submit" class="btn-action btn-save"><i class="ph-bold ph-floppy-disk"></i> Save
                    Changes</button>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="prd-editor" name="prd_content">{{ idea.prd_content|safe }}</textarea>
        </div>
    </form>
</div>

<!-- Include CKEditor -->
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
<script>
    // Initialize the visual text editor
    CKEDITOR.replace('prd_content', {
        height: 700,
        toolbar: [
            { name: 'document', items: ['Source', '-', 'NewPage', 'Preview', '-', 'Templates'] },
            { name: 'clipboard', items: ['Cut', 'Copy', 'Paste', 'PasteText', 'PasteFromWord', '-', 'Undo', 'Redo'] },
            { name: 'editing', items: ['Find', 'Replace', '-', 'SelectAll', '-', 'Scayt'] },
            '/',
            { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike', 'Subscript', 'Superscript', '-', 'RemoveFormat'] },
            { name: 'paragraph', items: ['NumberedList', 'BulletedList', '-', 'Outdent', 'Indent', '-', 'Blockquote', 'CreateDiv', '-', 'JustifyLeft', 'JustifyCenter', 'JustifyRight', 'JustifyBlock', '-', 'BidiLtr', 'BidiRtl'] },
            { name: 'links', items: ['Link', 'Unlink', 'Anchor'] },
            { name: 'insert', items: ['Image', 'Table', 'HorizontalRule', 'Smiley', 'SpecialChar', 'PageBreak', 'Iframe'] },
            '/',
            { name: 'styles', items: ['Styles', 'Format', 'Font', 'FontSize'] },
            { name: 'colors', items: ['TextColor', 'BGColor'] },
            { name: 'tools', items: ['Maximize', 'ShowBlocks'] }
        ],
        // Clean UI
        removeButtons: 'Subscript,Superscript,Cut,Copy,Paste,PasteText,PasteFromWord',
        uiColor: '#ffffff'
    });
</script>
{% endblock %}
