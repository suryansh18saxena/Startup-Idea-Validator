<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %} {% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@1.4.2/src/css/phosphor.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"rel="stylesheet">
   
  

  <style>
    :root {
      --bg-secondary: #f9fafb;
      --border-light: #e5e7eb;
      --primary: #4f46e5;
      --gradient-soft: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(6, 182, 212, 0.1));
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --gradient-primary: linear-gradient(135deg, #4f46e5, #06b6d4);
      --shadow-lg: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #fff;
    }

    /* ✅ Sidebar Adjusted */
    /* ✅ Sidebar Adjusted with Glass Effect */
.sidebar {
    width: 220px;
    height: 100vh;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 200;
    transition: transform 0.4s ease-in-out;
    
    /* --- ✨ Glass Effect Properties Start --- */
    background: rgba(255, 255, 255, 0.15); /* Semi-transparent background */
    backdrop-filter: blur(12px);          /* The key blur effect */
    -webkit-backdrop-filter: blur(12px);  /* For Safari browser compatibility */
    border-right: 1px solid rgba(255, 255, 255, 0.2); /* Light border to define the edge */
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); /* Subtle shadow to lift the element */
    /* --- ✨ Glass Effect Properties End --- */
}

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
    }

    .sidebar-nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-secondary);
      font-weight: 500;
      transition: all 0.3s ease;
      margin-bottom: 0.4rem;
    }

    .sidebar-nav a:hover {
      background: var(--gradient-soft);
      color: var(--text-primary);
    }

    .sidebar-nav a.active {
      color: var(--primary);
      background: var(--gradient-soft);
      font-weight: 600;
    }

    /* ✅ Dashboard header shifted to align with sidebar */
    .dashboard-header {
      margin-left:260px; /* create space for sidebar */
      margin-right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
      margin-top: 20px;
      border-radius: 20px;
      padding: 0 1.5rem;

      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);

      background-image: linear-gradient(135deg,
          rgba(79, 70, 229, 0.4) 0%,
          rgba(6, 182, 212, 0.4) 100%);
    }

    .dashboard-header .greeting p {
      color: black;
      font-weight: 600;
    }

    .dashboard-header .header-actions .btn {
      padding: 0.7rem 1.3rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 500;
      border: none;
      background: var(--gradient-primary);
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dashboard-header .header-actions .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 180px;
        padding: 1rem;
      }

      .dashboard-header {
        margin-left: 200px;
        flex-direction: column;
        align-items: flex-start;
        height: auto;
        padding: 1rem;
      }
    }

      @keyframes move {
            100% { transform: translate3d(0, 0, 1px) rotate(360deg); }
        }

        .background {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            background: var(--bg-primary);
            overflow: hidden;
            z-index: -1;
        }

        .background span {
            width: 20vmin;
            height: 20vmin;
            border-radius: 20vmin;
            backface-visibility: hidden;
            position: absolute;
            animation: move;
            animation-duration: 45s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .background span:nth-child(1) { color: var(--secondary); top: 29%; left: 4%; animation-duration: 49s; animation-delay: -2s; transform-origin: 1vw -2vh; box-shadow: -40vmin 0 5.2vmin currentColor; }
       .background span:nth-child(2) { color: var(--danger); top: 58%; left: 2%; animation-duration: 47s; animation-delay: -4s; transform-origin: -16vw 1vh; box-shadow: 40vmin 0 5.5vmin currentColor; }
       .background span:nth-child(3) { color: var(--success); top: 51%; left: 98%; animation-duration: 43s; animation-delay: -5s; transform-origin: 19vw -18vh; box-shadow: 40vmin 0 5.8vmin currentColor; }
       .background span:nth-child(4) { color: var(--primary); top: 44%; left: 51%; animation-duration: 45s; animation-delay: -9s; transform-origin: -10vw 2vh; box-shadow: 40vmin 0 5.8vmin currentColor; }
       .background span:nth-child(5) { color: var(--secondary); top: 88%; left: 81%; animation-duration: 43s; animation-delay: -11s; transform-origin: 7vw -11vh; box-shadow: -40vmin 0 5.2vmin currentColor; }
       .background span:nth-child(6) { color: var(--primary); top: 8%; left: 11%; animation-duration: 41s; animation-delay: -14s; transform-origin: 1vw 12vh; box-shadow: -40vmin 0 5.1vmin currentColor; }

  </style>
</head>

<body>
 <div class="background">
        <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="ph-fill ph-rocket-launch"></i><span>IdeaSaarthi</span>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="{% url 'dashboard' %}" class="{% if path == '/dashboard/' %}active{% endif %}"><i class="ph-fill ph-squares-four"></i> Dashboard</a></li>
        <li><a href="{% url 'create_idea' %}" class="{% if path == '/create_idea' %}active{% endif %}"><i class="ph-fill ph-lightbulb-filament"></i> Submit Idea</a></li>
        <li><a href="{% url 'manage_ideas' %}" class="{% if path == '/manage_ideas/' %}active{% endif %}"><i class="ph-fill ph-folder-simple"></i> Manage Ideas</a></li>
        <li><a href="{% url 'request' %}" class="{% if path == '/request/' %}active{% endif %}"><i class="ph-fill ph-handshake"></i> Requests</a></li>
        <li><a href="{% url 'profile' %}" class="{% if path == '/profile/' %}active{% endif %}"><i class="ph-fill ph-user"></i> Profile</a></li>
        <li><a href="{% url 'logout' %}" class="{% if path == '/logout/' %}active{% endif %}"><i class="ph-fill ph-sign-out"></i> Logout</a></li>
      </ul>
    </nav>
  </aside>

  <header class="dashboard-header">
    <div class="greeting">
      {% if user.is_authenticated %}
      <p>Welcome, {{ user.first_name }}</p>
      {% endif %}
    </div>
    {% block button %}
    <div class="header-actions">
      <a href="{% url 'create_idea' %}" class="btn"><i class="ph-fill ph-plus-circle"></i> Submit New Idea</a>
    </div>
    {% endblock %}

    {% block printbutton %}
            <button class="btn-print" onclick="window.print()"><i class="ph-fill ph-printer"></i> Print Report</button>
    {% endblock %}
  </header>

  {% block body %}

  {% endblock %}

</body>

</html>
